name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ecojotaduo
          POSTGRES_PASSWORD: ecojotaduo
          POSTGRES_DB: ecojotaduo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecojotaduo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # lê a versão do campo packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # O papel restrito é obrigatório: o PostgreSQL não aplica RLS ao dono das
      # tabelas, então sem ele os testes de isolamento seriam falso-positivos.
      - name: Preparar banco de testes
        env:
          PGPASSWORD: ecojotaduo
        run: |
          psql -h localhost -U ecojotaduo -d ecojotaduo -v ON_ERROR_STOP=1 \
            -c "create role ecojotaduo_app with login password 'ecojotaduo_app'"
          createdb -h localhost -U ecojotaduo ecojotaduo_test
          psql -h localhost -U ecojotaduo -d ecojotaduo_test -v ON_ERROR_STOP=1 \
            -c "grant connect on database ecojotaduo_test to ecojotaduo_app" \
            -c "grant usage on schema public to ecojotaduo_app"
          cp .env.test.example .env.test

      - name: Formatação
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # As suítes de integração chamam `exigirBancoEmCI()`: com CI=true e sem
      # banco configurado elas FALHAM, em vez de passarem puladas.
      - name: Testes (unitários + integração)
        run: pnpm test

      - name: Build
        run: pnpm build
