name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ecojotaduo
          POSTGRES_PASSWORD: ecojotaduo
          POSTGRES_DB: ecojotaduo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecojotaduo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # lê a versão do campo packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Duas coisas aqui. O papel restrito é obrigatório: o PostgreSQL não
      # aplica RLS ao dono das tabelas, então sem ele os testes de isolamento
      # seriam falso-positivos. E `ecojotaduo_test` é só o banco de MANUTENÇÃO
      # — cada pacote cria e usa o seu (`ecojotaduo_test_<pacote>`), para as
      # suítes rodarem em paralelo sem disputar a mesma base.
      - name: Preparar banco de testes
        env:
          PGPASSWORD: ecojotaduo
        run: |
          psql -h localhost -U ecojotaduo -d ecojotaduo -v ON_ERROR_STOP=1 \
            -c "create role ecojotaduo_app with login password 'ecojotaduo_app'"
          createdb -h localhost -U ecojotaduo ecojotaduo_test
          psql -h localhost -U ecojotaduo -d ecojotaduo_test -v ON_ERROR_STOP=1 \
            -c "grant connect on database ecojotaduo_test to ecojotaduo_app" \
            -c "grant usage on schema public to ecojotaduo_app"
          cp .env.test.example .env.test

      - name: Formatação
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # As suítes de integração chamam `exigirBancoEmCI()`: com CI=true e sem
      # banco configurado elas FALHAM, em vez de passarem puladas.
      - name: Testes (unitários + integração)
        run: pnpm test

      - name: Build
        run: pnpm build

      # O contrato publicado e o SDK são versionados. Regenerar e comparar
      # garante que nunca fiquem atrás do código — e faz toda mudança de
      # contrato aparecer no diff do PR, onde dá para avaliar se quebra alguém.
      - name: Contrato OpenAPI e SDK em dia
        run: |
          pnpm --filter @ecojotaduo/api openapi
          pnpm --filter @ecojotaduo/api-client generate
          if ! git diff --exit-code -- docs/api/openapi.json packages/api-client/src/schema.ts; then
            echo "::error::O contrato mudou mas nao foi regenerado. Rode:"
            echo "::error::  pnpm --filter @ecojotaduo/api openapi"
            echo "::error::  pnpm --filter @ecojotaduo/api-client generate"
            exit 1
          fi

  # As imagens só são exercitadas no deploy — e Dockerfile que ninguém constrói
  # quebra exatamente na hora em que se precisa dele. Aqui elas são construídas
  # (e não publicadas): o objetivo é pegar a quebra no PR, não distribuir.
  imagens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir as imagens dos serviços
        run: |
          for app in api mcp-gateway worker; do
            docker build \
              --file docker/Dockerfile \
              --build-arg APP="$app" \
              --tag "ecojotaduo/$app:ci" \
              --cache-from type=gha,scope="$app" \
              --cache-to type=gha,mode=max,scope="$app" \
              --load \
              .
          done

      - name: Construir a imagem da aplicação web
        run: |
          docker build \
            --file docker/Dockerfile.web \
            --tag ecojotaduo/web:ci \
            --cache-from type=gha,scope=web \
            --cache-to type=gha,mode=max,scope=web \
            --load \
            .

      # Cada serviço precisa CONSEGUIR SUBIR. O worker já quebrou no boot por
      # carregar, sem precisar, o NestJS que vinha pela reexportação dos
      # controllers — coisa que nenhum teste unitário pegaria.
      - name: Os serviços sobem
        run: |
          docker compose -f docker/docker-compose.prod.yml --env-file docker/ci.env up -d --no-build
          for tentativa in $(seq 1 30); do
            saudaveis=$(docker compose -f docker/docker-compose.prod.yml --env-file docker/ci.env \
              ps --format '{{.Service}} {{.Status}}' | grep -c healthy || true)
            if [ "$saudaveis" -ge 3 ]; then break; fi
            sleep 5
          done
          docker compose -f docker/docker-compose.prod.yml --env-file docker/ci.env ps

      # Só o que é PÚBLICO. Os endpoints de saúde ficam de propósito fora do
      # proxy — quem os consulta é o orquestrador, pela rede interna, e expô-los
      # daria a qualquer um um jeito barato de sondar a disponibilidade.
      - name: Fluxo mínimo pelo proxy
        run: |
          curl -sf -o /dev/null http://localhost/           # a tela responde
          curl -sf -o /dev/null http://localhost/rota-que-nao-existe  # SPA: cai no index
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/v1/auth/me)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/mcp)" = "401"

      - name: Diagnóstico quando algo falha
        if: failure()
        run: docker compose -f docker/docker-compose.prod.yml --env-file docker/ci.env logs --tail=60

      - name: Derrubar
        if: always()
        run: docker compose -f docker/docker-compose.prod.yml --env-file docker/ci.env down -v
