# Implantação inicial: uma VM, Docker Compose, um domínio.
#
#   cp docker/producao.env.example docker/.env.prod   # e preencha
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.prod up -d --build
#
# Três coisas que este arquivo decide, e valem explicação:
#
# 1. **A migração é um serviço à parte**, não um passo no boot da API. Se cada
#    réplica migrasse ao subir, um deploy com N réplicas dispararia N migrações
#    concorrentes; e um rollback de imagem tentaria migrar para trás. Aqui ela
#    roda uma vez, com a conexão do DONO, e as réplicas só sobem depois.
#
# 2. **A aplicação conecta com o papel restrito** (`DATABASE_URL`), separado do
#    dono (`DATABASE_ADMIN_URL`). O PostgreSQL não aplica RLS ao dono: sem essa
#    separação, todo o isolamento entre empresas vira decoração.
#
# 3. **Tudo atrás do mesmo domínio.** O refresh token vive num cookie
#    `SameSite=Strict` (ADR-0011); tela e API em domínios diferentes fariam o
#    navegador não enviá-lo, e a sessão morreria a cada recarregamento sem
#    erro nenhum — que é o pior modo de falhar.

name: ecojotaduo

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
  JWT_SECRET: ${JWT_SECRET:?defina em docker/.env.prod}
  JWT_ISSUER: ${JWT_ISSUER:-ecojotaduo-platform}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-ecojotaduo-api}
  SECRETS_KEY: ${SECRETS_KEY:?defina em docker/.env.prod (openssl rand -base64 32)}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
  RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-10}
  RATE_LIMIT_MCP_MAX: ${RATE_LIMIT_MCP_MAX:-120}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina em docker/.env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina em docker/.env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?defina em docker/.env.prod}
      APP_DB_USER: ${APP_DB_USER:?defina em docker/.env.prod}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?defina em docker/.env.prod}
    volumes:
      - pgdata:/var/lib/postgresql
      # Só roda com o volume vazio: cria o papel restrito da aplicação.
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    # Sem porta publicada: só a rede interna do compose alcança o banco.

  # Passo explícito de deploy. Sobe, migra e sai; os apps esperam o sucesso.
  migrate:
    image: ecojotaduo/api:${TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: api
    environment:
      <<: *app-env
      # A migração é a ÚNICA coisa que usa a conexão do dono.
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ['node', 'dist/cli/migrate.js']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    image: ecojotaduo/api:${TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: api
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Readiness, não liveness: o balanceador só deve mandar tráfego para
      # réplica que já alcança o banco.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    # `docker compose up --scale api=3` para mais réplicas: os apps são
    # stateless por desenho (ADR-0009), então isso funciona sem ajuste.

  mcp-gateway:
    image: ecojotaduo/mcp-gateway:${TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: mcp-gateway
    restart: unless-stopped
    environment:
      <<: *app-env
      MCP_PORT: 3001
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  worker:
    image: ecojotaduo/worker:${TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: worker
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Sem healthcheck HTTP: o worker não serve porta. O sinal de saúde dele é
    # o outbox drenando — ver o runbook de eventos não entregues.

  # O CRM como processo próprio (Fase 12, ADR-0016). Desligado por padrão:
  #
  #   docker compose ... --profile crm-extraido up -d
  #
  # e `CRM_SERVICE_URL=http://crm-service:3002` no `.env.prod`. Sem a variável
  # o serviço até sobe, mas ninguém fala com ele — a plataforma continua com o
  # CRM em processo. São as duas metades da mesma decisão, e é de propósito
  # que estejam separadas: dá para subir o serviço e observá-lo antes de
  # mandar tráfego para ele.
  #
  # Sem porta publicada. A fronteira é interna: quem chama é a plataforma, com
  # token assinado de audiência interna e vida de 60 segundos.
  crm-service:
    profiles: ['crm-extraido']
    image: ecojotaduo/crm-service:${TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP: crm-service
    restart: unless-stopped
    environment:
      <<: *app-env
      CRM_SERVICE_PORT: 3002
      # Pode apontar para OUTRO banco: nenhuma tabela `crm_*` tem chave
      # estrangeira para fora do módulo, e há teste travando essa propriedade.
      DATABASE_URL: ${CRM_DATABASE_URL:-postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  web:
    image: ecojotaduo/web:${TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    environment:
      # As aspas importam: o `https://` da mensagem tem `: `, e sem elas o
      # YAML interpreta como mapa aninhado.
      SITE_ADDRESS: '${SITE_ADDRESS:?defina o endereco publico em docker/.env.prod}'
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
      # Em teste local sem DNS: CADDY_EXTRA_GLOBAL=local_certs
      CADDY_EXTRA_GLOBAL: ${CADDY_EXTRA_GLOBAL:-}
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - api
      - mcp-gateway
    healthcheck:
      # A API de administração do Caddy, e não a porta 80: o bloco público
      # responde pelo NOME do site (`SITE_ADDRESS`), então uma requisição a
      # 127.0.0.1 não casaria com ele em produção. O `/config/` prova as duas
      # coisas que importam — o processo está de pé e carregou a configuração.
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      # Certificados emitidos pelo ACME: sem persistir, cada reinício pede
      # certificado novo e esbarra no limite de emissão do Let's Encrypt.
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  caddydata:
  caddyconfig:
