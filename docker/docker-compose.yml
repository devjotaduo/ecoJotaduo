# Infraestrutura de desenvolvimento local.
# 1. cp docker/.env.example docker/.env   (ajuste se quiser)
# 2. docker compose -f docker/docker-compose.yml up -d
# As credenciais vêm do docker/.env (gitignored); nada de segredo neste arquivo.
name: ecojotaduo-platform

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina em docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina em docker/.env}
      POSTGRES_DB: ${POSTGRES_DB:?defina em docker/.env}
      APP_DB_USER: ${APP_DB_USER:?defina em docker/.env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?defina em docker/.env}
      TEST_DB_NAME: ${TEST_DB_NAME:-ecojotaduo_test}
    ports:
      - '5432:5432'
    volumes:
      # A imagem 18+ recomenda montar /var/lib/postgresql (cobre o novo layout
      # de PGDATA versionado, preparado para pg_upgrade).
      - pgdata:/var/lib/postgresql
      # Roda só na primeira subida: cria o papel da aplicação e o banco de testes.
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
